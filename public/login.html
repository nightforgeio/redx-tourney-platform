<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — RedX Gamerz</title>
<meta name="description" content="Log in to your RedX Gamerz account.">
<meta name="theme-color" content="#07090f">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://redx-tourney-platform.onrender.com/login.html">
<meta name="robots" content="noindex,follow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="RedX Gamerz">
<meta property="og:title" content="Log in - RedX Gamerz">
<meta property="og:description" content="Log in to your RedX Gamerz account.">
<meta property="og:url" content="https://redx-tourney-platform.onrender.com/login.html">
<meta property="og:locale" content="hi_IN">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Log in - RedX Gamerz">
<meta name="twitter:description" content="Log in to your RedX Gamerz account.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<a class="skiplink" href="#main">Skip to content / सीधा सामग्री पर जाओ</a>
<noscript><div class="wrap" style="padding:16px">This site needs JavaScript to show tournaments, room IDs and your wallet. / टूर्नामेंट, रूम ID और वॉलेट देखने के लिए JavaScript जरूरी है।</div></noscript>
<main id="main">
  <div class="wrap" style="max-width:480px">
    <section class="panel section reveal">
      <h1 data-t="a.login">लॉग इन</h1>
      <p class="muted small" data-t="a.login.body">जिस ईमेल या यूजरनेम से रजिस्टर किया था, वही डालो।</p>
      <div id="alert"></div>
      <form class="form mt2" id="form">
        <div class="field">
          <label for="identifier" data-t="f.identifier">ईमेल या यूजरनेम</label>
          <input id="identifier" name="identifier" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password" data-t="f.password">पासवर्ड</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn primary wide" type="submit" data-t="a.login">लॉग इन</button>
      </form>
      <p class="small muted mt2 mb0"><span data-t="a.noaccount">नए हो?</span> <a href="/register.html" data-t="nav.register">रजिस्टर करें</a></p>
    </section>
  </div>
</main>
<script type="module" src="/assets/pages/login.js"></script>
</body>
</html>
