# Render blueprint - RedX Gamerz tournament platform.
#
# This file describes the service that is ACTUALLY live. Keep it in sync with
# the dashboard, it is the only machine-readable record of the deploy config.
#
# Deliberate choices, each one learned the hard way from the live deploy:
#  - plan: free       -> no payment card on the account, so no persistent disk.
#  - DATA_DIR=./data  -> the SQLite file lives on the instance's ephemeral disk.
#                        DATA RESETS ON EVERY DEPLOY. Attach the `disk:` block
#                        below (needs a card on file) before real prize data is kept.
#  - startCommand runs migrate + seed:admin first. seed-admin is idempotent: it
#    exits 0 when an admin already exists, so redeploys never duplicate or reset it.
services:
  - type: web
    name: redx-tourney-platform
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: npm run migrate && npm run seed:admin && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.23.0"
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: ./data
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: admin@redxgamerz.in
      - key: ADMIN_PASSWORD
        sync: false
# Persistent storage - enable only after a payment card is on the account,
# otherwise Render rejects the deploy with 402 Payment Required.
