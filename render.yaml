# Render deployment — RedX Gamerz tournament platform
# Free tier. The SQLite file lives on a persistent disk so data survives deploys.
services:
  - type: web
    name: redx-tourney-platform
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22.23.0"
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: redx-data
      mountPath: /var/data
      sizeGB: 1
